<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>MicroTeach - Register</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1F3864',
              navyHover: '#172B4D',
              subtleBg: '#F8FAFC',
              border: '#E2E8F0',
              muted: '#64748B',
              heading: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-[#EEF2F6] min-h-screen flex flex-col justify-between items-center px-4 py-8 antialiased text-slate-800">
<!-- BEGIN: MainContent -->
<main class="w-full flex-grow flex items-center justify-center py-6">
<!-- BEGIN: AuthCard -->
<div class="bg-white w-full max-w-[490px] rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 sm:p-10 transition-all" data-purpose="login-card">
<!-- Brand Logo and Header -->
<div class="text-center mb-7">
<div class="inline-flex items-center justify-center gap-1.5 mb-5">
<div class="w-5 h-5 bg-[#1F3864] rounded flex items-center justify-center text-white">
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"></path>
</svg>
</div>
<span class="font-bold text-base tracking-tight text-[#1F3864]">MicroTeach<span class="text-blue-500 font-normal ml-0.5 text-xs align-super">✦</span></span>
</div>
<h1 class="text-2xl sm:text-[26px] font-bold text-[#0F172A] tracking-tight">Create your account</h1>
<p class="text-[13.5px] text-slate-500 mt-2 font-normal leading-relaxed">Join your campus peer learning &amp; micro-tutoring network</p>
</div>
<!-- Institutional SSO Quick Button -->
<div>
<button class="w-full h-11 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl flex items-center justify-center gap-2.5 text-[13.5px] font-medium text-slate-700 transition duration-150 shadow-sm" type="button">
<svg class="w-4 h-4 text-slate-700" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3L1 9l11 6l9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"></path>
</svg>
<span class="">Sign up with University / Work Email</span>
</button>
</div>
<!-- Divider -->
<div class="relative my-6 text-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200"></div>
</div>
<div class="relative flex justify-center text-[10px] uppercase font-semibold tracking-wider">
<span class="bg-white px-3 text-slate-400">Or register with email</span>
</div>
</div>
<!-- BEGIN: RegistrationForm -->
<form action="login.html" class="space-y-4" method="GET" onsubmit="return validateForm(event);">
<!-- Field 1: Full Name -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-600 uppercase mb-1.5" for="full-name">
            Full Name
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1F3864]/20 focus:border-[#1F3864] transition-colors" id="full-name" name="full-name" placeholder="Tahmid Kabir" required="" type="text">
</div>
</div>
<!-- Field 2: Email -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-600 uppercase mb-1.5" for="email">
            Email Address
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1F3864]/20 focus:border-[#1F3864] transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Field 3: Department -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-600 uppercase mb-1.5" for="department">
            Department / Major
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<select class="block w-full pl-10 pr-10 py-2.5 text-sm text-slate-700 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1F3864]/20 focus:border-[#1F3864] transition-colors appearance-none cursor-pointer" id="department" name="department" required="">
<option disabled="" selected="" value="">Select Department / Major</option>
<option value="cs">Computer Science &amp; Engineering</option>
<option value="ee">Electrical &amp; Electronics Engineering</option>
<option value="math">Mathematics &amp; Applied Statistics</option>
<option value="bio">Biology &amp; Biomedical Sciences</option>
<option value="econ">Economics &amp; Finance</option>
<option value="chem">Chemistry &amp; Chemical Engineering</option>
<option value="other">Other Campus Department</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Field 4: Password -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-600 uppercase mb-1.5" for="password">
            Password
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 text-sm text-slate-900 placeholder-slate-400 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1F3864]/20 focus:border-[#1F3864] transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" id="toggle-password-btn" title="Toggle password visibility" type="button">
<svg class="h-4 w-4" fill="none" id="eye-icon-pw" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Field 5: Confirm Password -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-600 uppercase mb-1.5" for="confirm-password">
            Confirm Password
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1F3864]/20 focus:border-[#1F3864] transition-colors" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Terms Agreement -->
<div class="pt-1">
<label class="flex items-start cursor-pointer select-none">
<input class="mt-1 h-4 w-4 rounded border-slate-300 text-[#1F3864] focus:ring-[#1F3864] focus:ring-offset-0 transition-colors" required="" type="checkbox">
<span class="ml-2.5 text-xs text-slate-500 leading-normal">
              I agree to the <a class="text-slate-700 font-medium underline hover:text-[#1F3864]" href="#">Honor Code</a>, <a class="text-slate-700 font-medium underline hover:text-[#1F3864]" href="#">Academic Integrity Charter</a>, and <a class="text-slate-700 font-medium underline hover:text-[#1F3864]" href="#">Terms of Service</a>
            </span>
</label>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full h-11 bg-[#1F3864] hover:bg-[#172B4D] active:scale-[0.99] text-white font-medium text-sm rounded-xl shadow-md transition-all duration-150 flex items-center justify-center tracking-wide" type="submit">
            Create Account
          </button>
</div>
</form>
<!-- END: RegistrationForm -->
<!-- Helper Link: Register Redirect -->
<div class="mt-5 text-center text-[13px] text-slate-500">
        Already have an account?
        <a class="text-[#1F3864] font-semibold hover:underline ml-1" href="login.html">Log in</a>
</div>
<!-- Trust and Academic Integrity Verification Footnote -->
<div class="mt-7 pt-5 border-t border-slate-100 text-center">
<div class="flex items-center justify-center gap-1.5 text-slate-400 text-xs">
<svg class="w-3.5 h-3.5 text-amber-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" fill-rule="evenodd"></path>
</svg>
<span class="text-[11.5px] leading-tight text-slate-500 font-normal">Secure campus authentication • Encrypted session</span>
</div>
</div>
</div>
<!-- END: AuthCard -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: SiteFooter -->
<footer class="w-full py-4 text-center text-xs text-slate-400">
<div class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1">
<span class="">© 2025 MicroTeach Campus Micro-Learning. All rights reserved.</span>
<span class="">•</span>
<a class="hover:text-slate-600 transition-colors" href="#">Terms</a>
<span class="">•</span>
<a class="hover:text-slate-600 transition-colors" href="#">Privacy</a>
</div>
</footer>
<!-- END: SiteFooter -->
<!-- BEGIN: Scripts -->
<script data-purpose="toggle-password-visibility">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          toggleBtn.classList.toggle('text-[#1F3864]', isPassword);
          toggleBtn.classList.toggle('text-slate-400', !isPassword);
        });
      }
    });

    function validateForm(event) {
      event.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      if (password.length < 8) {
        alert('Password must be at least 8 characters long');
        return false;
      }
      
      if (!/\d/.test(password)) {
        alert('Password must contain at least one number');
        return false;
      }
      
      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return false;
      }
      
      window.location.href = 'login.html';
      return false;
    }
  </script>
<!-- END: Scripts -->
</body></html>
